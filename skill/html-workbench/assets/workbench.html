<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 可视化编辑台</title>
  <link rel="stylesheet" href="/vendor/grapesjs/css/grapes.min.css">
  <style data-bundle="workbench">
/* Source stylesheet. The build step inlines this file into workbench.html. */
:root {
  font-family: Geist, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
  color: #18181b;
  --surface: rgba(255, 255, 255, .94);
  --panel: #fbfbfa;
  --canvas: #ececea;
  --line: rgba(24, 24, 27, .12);
  --line-strong: rgba(24, 24, 27, .2);
  --muted: #71717a;
  --ink: #20201f;
  --success: #278455;
  --warning: #b7791f;
  --danger: #c2413b;
  --shadow: 0 16px 45px rgba(38, 38, 35, .13), 0 2px 8px rgba(38, 38, 35, .07);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; }
body { min-width: 0; overflow: hidden; background: var(--canvas); }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.workbench { position: relative; width: 100%; height: 100%; overflow: hidden; }
.topbar {
  position: absolute;
  z-index: 30;
  top: 10px;
  left: 58px;
  right: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}
.toolbar-cluster {
  display: flex;
  align-items: center;
  min-width: 0;
  height: 42px;
  padding: 4px;
  border: 1px solid rgba(255, 255, 255, .85);
  border-radius: 11px;
  background: var(--surface);
  box-shadow: 0 8px 28px rgba(38, 38, 35, .12), inset 0 0 0 1px var(--line);
  backdrop-filter: blur(18px) saturate(1.15);
  pointer-events: auto;
}
.file-cluster { position: relative; max-width: min(320px, 32vw); padding: 0; }
.file-menu-button {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 40px;
  padding: 0 10px 0 6px;
  border: 0;
  color: var(--ink);
  background: transparent;
  cursor: pointer;
}
.file-menu-button > strong { overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.file-menu-button > svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; transition: transform .18s ease; }
.file-menu-button[aria-expanded="true"] > svg { transform: rotate(180deg); }
.product-mark {
  padding: 5px 6px 4px;
  border-radius: 5px;
  color: #fff;
  background: var(--ink);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
}
.sync-status { display: flex; align-items: center; min-width: 8px; color: var(--muted); }
.sync-status i { width: 7px; height: 7px; border-radius: 50%; background: #a1a1aa; box-shadow: 0 0 0 3px rgba(161, 161, 170, .12); }
.sync-status b { width: 0; overflow: hidden; font-size: 10px; font-weight: 500; opacity: 0; white-space: nowrap; }
.sync-status[data-state="saved"] i { background: var(--success); box-shadow: 0 0 0 3px rgba(39, 132, 85, .12); }
.sync-status[data-state="dirty"] i, .sync-status[data-state="saving"] i { background: var(--warning); }
.sync-status[data-state="conflict"] i, .sync-status[data-state="error"] i { background: var(--danger); }

.file-popover {
  position: absolute;
  top: 50px;
  left: 0;
  width: min(520px, calc(100vw - 80px));
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(255, 255, 255, .98);
  box-shadow: var(--shadow);
}
.file-popover label { display: block; margin-bottom: 8px; color: #3f3f46; font-size: 11px; font-weight: 650; }
.file-open-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
.file-open-row input { min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; outline: 0; color: #27272a; background: #fafafa; font-size: 11px; }
.file-open-row input:focus { border-color: #52525b; box-shadow: 0 0 0 3px rgba(63, 63, 70, .1); }
.file-popover p { margin: 9px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }

.viewport-controls { flex: none; gap: 2px; }
.toolbar-separator { width: 1px; height: 20px; margin: 0 3px; background: var(--line); }
.toolbar-cluster button, .panel-actions button {
  min-height: 32px;
  border: 0;
  border-radius: 7px;
  color: #52525b;
  background: transparent;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, transform .12s ease, box-shadow .18s ease;
}
.toolbar-cluster button:hover, .panel-actions button:hover { color: #18181b; background: rgba(24, 24, 27, .06); }
.toolbar-cluster button:active, .panel-actions button:active, .tool-rail button:active { transform: translateY(1px) scale(.98); }
.toolbar-cluster button:focus-visible, .panel-actions button:focus-visible, .tool-rail button:focus-visible { outline: 2px solid #3f3f46; outline-offset: 2px; }
.viewport-controls button { min-width: 42px; padding: 0 8px; }
.viewport-controls .mode-button { min-width: 44px; }
.viewport-controls .fit-button { min-width: 48px; }
.viewport-controls button.active { color: #fff; background: var(--ink); box-shadow: 0 2px 7px rgba(24, 24, 27, .22); }
.actions { flex: none; gap: 2px; }
.icon-button { display: inline-grid; place-items: center; width: 32px; padding: 0; }
.icon-button svg, .save-button svg, .tool-rail svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.55; }
.actions .save-button { display: flex; align-items: center; gap: 6px; min-width: 70px; margin-left: 2px; padding: 0 10px; color: #fff; background: var(--ink); }
.actions .save-button:hover { color: #fff; background: #353532; }
.actions button:disabled { opacity: .45; cursor: not-allowed; }

.tool-rail {
  position: absolute;
  z-index: 28;
  top: 64px;
  left: 10px;
  display: grid;
  gap: 5px;
  width: 40px;
  padding: 4px;
  border: 1px solid rgba(255, 255, 255, .85);
  border-radius: 11px;
  background: var(--surface);
  box-shadow: 0 8px 26px rgba(38, 38, 35, .11), inset 0 0 0 1px var(--line);
  backdrop-filter: blur(18px);
}
.tool-rail button {
  display: grid;
  place-items: center;
  gap: 2px;
  width: 32px;
  min-height: 43px;
  padding: 5px 2px 4px;
  border: 0;
  border-radius: 7px;
  color: #71717a;
  background: transparent;
  cursor: pointer;
  transition: color .18s ease, background .18s ease, transform .12s ease;
}
.tool-rail button span { font-size: 8px; font-weight: 600; letter-spacing: .03em; }
.tool-rail button:hover { color: #18181b; background: rgba(24, 24, 27, .06); }
.tool-rail button.active { color: #fff; background: var(--ink); }

.control-panel {
  position: absolute;
  z-index: 25;
  top: 62px;
  bottom: 12px;
  left: 60px;
  display: flex;
  flex-direction: column;
  width: 288px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 13px;
  background: rgba(251, 251, 250, .97);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
  backdrop-filter: blur(20px) saturate(1.1);
}
.panel-header { display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 10px 10px 9px 14px; border-bottom: 1px solid var(--line); }
.panel-header > div:first-child { display: grid; gap: 2px; }
.panel-header small { color: var(--muted); font-size: 9px; letter-spacing: .08em; }
.panel-header strong { font-size: 13px; font-weight: 650; }
.panel-actions { display: flex; gap: 2px; }
.panel-actions .icon-button[aria-pressed="true"] { color: #fff; background: var(--ink); }
.panel-content { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
.section-label { margin: 0 0 10px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .08em; }

#blocks-panel { display: block; }
#blocks-panel .gjs-block-category { display: contents; }
#blocks-panel .gjs-title { display: none; }
#blocks-panel .gjs-blocks-c { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
#blocks-panel .gjs-block {
  width: auto;
  min-height: 64px;
  margin: 0;
  padding: 10px 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: #3f3f46;
  background: #fff;
  box-shadow: none;
  font-size: 10px;
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
#blocks-panel .gjs-block:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(38, 38, 35, .08); }
#styles-panel { color: #3f3f46; background: transparent; }
#styles-panel .gjs-sm-sector-title { padding: 9px 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 11px; }
#styles-panel .gjs-sm-properties { padding: 10px 0; }
#styles-panel .gjs-sm-property { width: 100%; margin-bottom: 9px; }
#styles-panel .gjs-sm-label { color: var(--muted); font-size: 10px; }
#styles-panel .gjs-field { border: 1px solid var(--line); border-radius: 6px; color: #18181b; background: #fff; }
.attributes-panel { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.attributes-panel label { display: grid; gap: 5px; margin: 9px 0; color: #52525b; font-size: 10px; }
.attributes-panel input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; outline: 0; }
.attributes-panel input:focus { border-color: #52525b; box-shadow: 0 0 0 3px rgba(63, 63, 70, .1); }

.canvas-area {
  position: absolute;
  inset: 0;
  min-width: 0;
  min-height: 0;
  overflow: auto;
  padding: 62px 12px 12px 58px;
  background: radial-gradient(circle at 52% 0%, rgba(255, 255, 255, .72), transparent 38%), var(--canvas);
  transition: padding-left .22s ease;
}
.workbench.panel-pinned .canvas-area { padding-left: 360px; }
.workbench[data-mode="preview"] .tool-rail,
.workbench[data-mode="preview"] .control-panel,
.workbench[data-mode="preview"] .edit-action { display: none !important; }
.workbench[data-mode="preview"] .canvas-area { padding-left: 12px; }
.workbench[data-mode="preview"] .canvas-viewport { box-shadow: 0 12px 38px rgba(38, 38, 35, .1); }
.canvas-stage { display: flex; justify-content: center; width: max-content; min-width: 100%; height: 100%; min-height: 320px; }
.canvas-viewport {
  flex: none;
  height: 100%;
  min-width: 320px;
  overflow: hidden;
  border: 1px solid rgba(63, 63, 70, .22);
  border-radius: 3px;
  background: #fff;
  box-shadow: 0 18px 50px rgba(38, 38, 35, .12);
  transform-origin: top center;
}
#gjs, .preview-frame { width: 100%; height: 100%; }
.preview-frame { display: block; border: 0; background: #fff; }
.workbench[data-mode="preview"] #gjs { display: none; }
.gjs-one-bg { background-color: #fff; }
.gjs-two-color { color: #3f3f46; }
.gjs-three-bg { background-color: var(--ink); }
.gjs-four-color, .gjs-four-color-h:hover { color: var(--ink); }
.gjs-cv-canvas { top: 0; width: 100%; height: 100%; background: #dededb; }
.gjs-frame-wrapper { background: #fff; }
.gjs-toolbar, .gjs-badge { color: #fff; background: var(--ink); }
.gjs-highlighter, .gjs-highlighter-sel { outline-color: var(--ink); }

@media (max-width: 820px) {
  .topbar { left: 54px; gap: 6px; }
  .file-cluster { max-width: 190px; }
  .viewport-controls button { min-width: 36px; padding-inline: 6px; }
  .viewport-controls .mode-button { min-width: 38px; }
  .actions .save-button { min-width: 34px; padding: 0 8px; }
  .actions .save-button span { display: none; }
}

@media (max-width: 650px) {
  .file-cluster { max-width: 150px; }
  .viewport-controls [data-width="375"], .viewport-controls [data-width="1280"] { display: none; }
  .toolbar-separator { margin-inline: 1px; }
  .actions #replace-image-button { display: none; }
}

</style>
</head>
<body>
  <main class="workbench" data-grapesjs-workbench="true">
    <header class="topbar" aria-label="编辑器工具栏">
      <div class="toolbar-cluster file-cluster">
        <button id="file-menu-button" class="file-menu-button" type="button" aria-expanded="false">
          <span class="product-mark">HTML</span>
          <strong id="file-name">未打开文件</strong>
          <span id="status" class="sync-status" data-state="idle"><i></i><b>等待打开文件</b></span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6.5 8 3.5 3.5L13.5 8"/></svg>
        </button>
        <div id="file-popover" class="file-popover" hidden>
          <label for="file-input">本地 HTML 文件</label>
          <div class="file-open-row">
            <input id="file-input" aria-label="HTML 文件绝对路径" placeholder="/absolute/path/page.html">
            <button id="open-button" type="button">打开</button>
          </div>
          <p>输入绝对路径，工作台会直接读取并同步保存。</p>
        </div>
      </div>

      <div class="toolbar-cluster viewport-controls" aria-label="工作台模式和画布尺寸">
        <button type="button" data-mode="edit" class="mode-button active" aria-pressed="true">编辑</button>
        <button type="button" data-mode="preview" class="mode-button" aria-pressed="false">预览</button>
        <span class="toolbar-separator" aria-hidden="true"></span>
        <button id="fit-button" class="fit-button active" type="button" aria-pressed="true">适应</button>
        <button type="button" data-width="375">375</button>
        <button type="button" data-width="768" class="active">768</button>
        <button type="button" data-width="1280">1280</button>
      </div>

      <div class="toolbar-cluster actions">
        <button id="undo-button" class="icon-button edit-action" type="button" aria-label="撤销" title="撤销">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 3.5 9l4 4"/><path d="M4 9h7a5 5 0 0 1 5 5"/></svg>
        </button>
        <button id="redo-button" class="icon-button edit-action" type="button" aria-label="重做" title="重做">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5 4 4-4 4"/><path d="M16 9H9a5 5 0 0 0-5 5"/></svg>
        </button>
        <button id="replace-image-button" class="icon-button edit-action" type="button" aria-label="替换图片" title="替换图片">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7" cy="8" r="1.2"/><path d="m5 14 3.5-3.5 2.5 2 2-2 2 2"/></svg>
        </button>
        <button id="save-button" class="primary save-button edit-action" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h10l2 2v12H4z"/><path d="M7 3v5h6V3M7 17v-5h6v5"/></svg>
          <span>保存</span>
        </button>
      </div>
    </header>

    <nav class="tool-rail" aria-label="编辑工具">
      <button type="button" data-panel="blocks" aria-label="添加内容" title="添加内容">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        <span>添加</span>
      </button>
      <button type="button" data-panel="styles" aria-label="调整样式" title="调整样式">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h8M15 6h1M4 14h1M8 14h8"/><circle cx="13.5" cy="6" r="1.5"/><circle cx="6.5" cy="14" r="1.5"/></svg>
        <span>样式</span>
      </button>
    </nav>

    <aside id="control-panel" class="control-panel" hidden>
      <header class="panel-header">
        <div><small>编辑工具</small><strong id="panel-title">添加内容</strong></div>
        <div class="panel-actions">
          <button id="pin-panel-button" class="icon-button" type="button" aria-label="固定面板" aria-pressed="false" title="固定面板">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 6 2-1 4 3 3-3 1-2 4-1-5-4-1 3-3z"/></svg>
          </button>
          <button id="close-panel-button" class="icon-button" type="button" aria-label="关闭面板" title="关闭面板">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
          </button>
        </div>
      </header>
      <section class="panel-content" data-panel-content="blocks">
        <p class="section-label">拖入画布</p>
        <div id="blocks-panel"></div>
      </section>
      <section class="panel-content" data-panel-content="styles" hidden>
        <p class="section-label">所选元素</p>
        <div id="styles-panel"></div>
        <section id="attributes-panel" class="attributes-panel" hidden>
          <p class="section-label">元素属性</p>
          <label>图片地址<input id="src-input"></label>
          <label>替代文本<input id="alt-input"></label>
          <label>链接地址<input id="href-input"></label>
        </section>
      </section>
    </aside>

    <section class="canvas-area">
      <div id="canvas-stage" class="canvas-stage">
        <div id="canvas-viewport" class="canvas-viewport" style="width:768px">
          <div id="gjs"></div>
          <iframe id="preview-frame" class="preview-frame" title="页面交互预览" hidden></iframe>
        </div>
      </div>
    </section>
  </main>
  <script src="/vendor/grapesjs/grapes.min.js"></script>
  <script type="module" data-bundle="workbench">
'use strict'

const grapesjs = window.grapesjs
const fileInput = document.querySelector('#file-input')
const fileName = document.querySelector('#file-name')
const status = document.querySelector('#status')
const saveButton = document.querySelector('#save-button')
const canvasArea = document.querySelector('.canvas-area')
const canvasStage = document.querySelector('#canvas-stage')
const viewport = document.querySelector('#canvas-viewport')
const fitButton = document.querySelector('#fit-button')
const fileMenuButton = document.querySelector('#file-menu-button')
const filePopover = document.querySelector('#file-popover')
const controlPanel = document.querySelector('#control-panel')
const closePanelButton = document.querySelector('#close-panel-button')
const pinPanelButton = document.querySelector('#pin-panel-button')
const panelTitle = document.querySelector('#panel-title')
const panelButtons = [...document.querySelectorAll('[data-panel]')]
const panelContents = [...document.querySelectorAll('[data-panel-content]')]
const attributesPanel = document.querySelector('#attributes-panel')
const srcInput = document.querySelector('#src-input')
const altInput = document.querySelector('#alt-input')
const hrefInput = document.querySelector('#href-input')
const workbench = document.querySelector('.workbench')
const modeButtons = [...document.querySelectorAll('[data-mode]')]
const previewFrame = document.querySelector('#preview-frame')

let editor
let activeFile = ''
let assetBase = ''
let revision = ''
let bodyScripts = []
let sourceCss = ''
let links = []
let headScripts = []
let htmlAttributes = {}
let bodyAttributes = {}
let appliedHtmlAttributes = new Set()
let appliedBodyAttributes = new Set()
let eventSource
let saveTimer
let applyingDocument = false
let dirty = false
let canvasWidth = 768
let fitCanvas = true
let activePanel = ''
let panelPinned = false
let workbenchMode = 'edit'

function setStatus(text, state = 'idle') {
  status.querySelector('b').textContent = text
  status.dataset.state = state
  saveButton.disabled = state === 'saving'
}

function api(route) {
  return `${route}?file=${encodeURIComponent(activeFile)}`
}

function setFilePopover(open) {
  filePopover.hidden = !open
  fileMenuButton.setAttribute('aria-expanded', String(open))
}

function setPanelPinned(pinned) {
  panelPinned = pinned
  pinPanelButton.setAttribute('aria-pressed', String(pinned))
  pinPanelButton.setAttribute('aria-label', pinned ? '取消固定面板' : '固定面板')
  pinPanelButton.title = pinned ? '取消固定' : '固定面板'
  document.querySelector('.workbench').classList.toggle('panel-pinned', pinned && !controlPanel.hidden)
  requestAnimationFrame(updateCanvasScale)
}

function closePanel() {
  controlPanel.hidden = true
  activePanel = ''
  panelButtons.forEach((button) => button.classList.remove('active'))
  setPanelPinned(false)
}

function openPanel(name) {
  if (activePanel === name && !controlPanel.hidden) return closePanel()
  activePanel = name
  controlPanel.hidden = false
  panelTitle.textContent = name === 'styles' ? '调整样式' : '添加内容'
  panelButtons.forEach((button) => button.classList.toggle('active', button.dataset.panel === name))
  panelContents.forEach((content) => { content.hidden = content.dataset.panelContent !== name })
  setPanelPinned(name === 'styles')
  requestAnimationFrame(() => {
    updateCanvasScale()
    editor?.refresh()
  })
}

function escapeAttribute(value) {
  return String(value).replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
}

function serializeAttributes(attributes = {}) {
  return Object.entries(attributes).map(([name, value]) => ` ${name}="${escapeAttribute(value)}"`).join('')
}

function serializeHeadScript(source) {
  return `<script${serializeAttributes(source.attributes)}>${source.content || ''}<\/script>`
}

function getBodyHtml() {
  // GrapesJS 的 wrapper 组件 tagName 为 'body'，editor.getHtml() 返回
  // <body>...</body>。服务端校验禁止 bodyHtml 包含 html/head/body/script
  // 标签，预览文档也已有 <body> 包装，因此这里取 wrapper 的 innerHTML。
  const wrapper = editor.getWrapper()
  return wrapper.getInnerHTML ? wrapper.getInnerHTML() : editor.getHtml().replace(/^<body\b[^>]*>/i, '').replace(/<\/body>\s*$/i, '')
}

function buildPreviewDocument() {
  const previewBase = new URL(assetBase, location.origin).href
  const stylesheets = links.map((href) => `<link rel="stylesheet" href="${escapeAttribute(href)}">`).join('\n')
  const scripts = headScripts.map(serializeHeadScript).join('\n')
  const overrideCss = editor.getCss()
  const previewHelpers = `<script>
document.addEventListener('click', function (event) {
  const link = event.target.closest && event.target.closest('a[href^="#"]')
  if (!link) return
  const fragment = link.getAttribute('href').slice(1)
  if (!fragment) return
  const target = document.getElementById(decodeURIComponent(fragment))
  if (!target) return
  event.preventDefault()
  target.scrollIntoView()
}, false)
<\/script>`
  return `<!doctype html>
<html${serializeAttributes(htmlAttributes)}>
<head>
  <meta charset="utf-8">
  <base href="${escapeAttribute(previewBase)}">
  ${stylesheets}
  <style>${sourceCss}</style>
  <style data-grapesjs-overrides>${overrideCss}</style>
  ${scripts}
</head>
<body${serializeAttributes(bodyAttributes)}>
${getBodyHtml()}
${bodyScripts.join('\n')}
${previewHelpers}
</body>
</html>`
}

function setWorkbenchMode(nextMode) {
  if (!editor || nextMode === workbenchMode || !['edit', 'preview'].includes(nextMode)) return
  workbenchMode = nextMode
  const previewing = workbenchMode === 'preview'
  workbench.dataset.mode = workbenchMode
  modeButtons.forEach((button) => {
    const active = button.dataset.mode === workbenchMode
    button.classList.toggle('active', active)
    button.setAttribute('aria-pressed', String(active))
  })
  if (previewing) {
    closePanel()
    setFilePopover(false)
    editor.select(null)
    previewFrame.srcdoc = buildPreviewDocument()
    previewFrame.hidden = false
  } else {
    previewFrame.hidden = true
    previewFrame.srcdoc = ''
  }
  requestAnimationFrame(() => {
    updateCanvasScale()
    editor.refresh()
  })
}

function updateCanvasScale() {
  if (!canvasArea || !viewport) return
  const styles = getComputedStyle(canvasArea)
  const availableWidth = canvasArea.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight)
  const availableHeight = canvasArea.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom)
  const scale = fitCanvas ? Math.min(1, availableWidth / canvasWidth) : 1
  viewport.style.width = `${canvasWidth}px`
  viewport.style.height = `${Math.max(320, availableHeight / scale)}px`
  viewport.style.zoom = String(scale)
  viewport.dataset.scale = scale.toFixed(3)
  canvasStage.style.minHeight = `${Math.max(320, availableHeight)}px`
  requestAnimationFrame(() => editor?.refresh())
}

function applySourceAttributes(element, attributes, appliedNames) {
  for (const name of appliedNames) element.removeAttribute(name)
  const nextNames = new Set()
  for (const [name, value] of Object.entries(attributes || {})) {
    element.setAttribute(name, value)
    nextNames.add(name)
  }
  return nextNames
}

function componentFromCanvasElement(element) {
  const node = element?.closest?.('[data-gjs-type][id]')
  if (!node) return null
  return editor.getWrapper().find(`#${node.id}`)[0] || null
}

async function injectSourceAssets() {
  const document = editor?.Canvas.getDocument()
  if (!document) return
  document.querySelectorAll('[data-source-asset]').forEach((node) => node.remove())
  appliedHtmlAttributes = applySourceAttributes(document.documentElement, htmlAttributes, appliedHtmlAttributes)
  appliedBodyAttributes = applySourceAttributes(document.body, bodyAttributes, appliedBodyAttributes)
  const base = document.createElement('base')
  base.href = new URL(assetBase, location.origin).href
  base.dataset.sourceAsset = 'true'
  document.head.prepend(base)

  for (const source of headScripts) {
    const script = document.createElement('script')
    for (const [name, value] of Object.entries(source.attributes || {})) script.setAttribute(name, value)
    script.dataset.sourceAsset = 'true'
    if (!script.src) {
      script.textContent = source.content || ''
      document.head.append(script)
      continue
    }
    await new Promise((resolve) => {
      script.addEventListener('load', resolve, { once: true })
      script.addEventListener('error', resolve, { once: true })
      document.head.append(script)
    })
  }
  for (const href of links) {
    const link = document.createElement('link')
    link.rel = 'stylesheet'
    link.href = href
    link.dataset.sourceAsset = 'true'
    document.head.append(link)
  }
  const style = document.createElement('style')
  style.dataset.sourceAsset = 'true'
  style.textContent = sourceCss
  document.head.append(style)
  const interactionStyle = document.createElement('style')
  interactionStyle.dataset.sourceAsset = 'true'
  interactionStyle.textContent = '[data-gjs-type="default"]:empty{pointer-events:none!important}'
  document.head.append(interactionStyle)

  if (!document.documentElement.dataset.workbenchInteractionBound) {
    document.documentElement.dataset.workbenchInteractionBound = 'true'
    document.addEventListener('click', (event) => {
      if (workbenchMode !== 'edit') return
      const component = componentFromCanvasElement(event.target)
      if (component) editor.select(component)
    }, true)
    document.addEventListener('dblclick', (event) => {
      if (workbenchMode !== 'edit') return
      const component = componentFromCanvasElement(event.target)
      if (!component) return
      editor.select(component)
      if (component.get('editable')) component.trigger('active', event)
    }, true)
  }

}

function initEditor() {
  editor = grapesjs.init({
    container: '#gjs',
    height: '100%',
    width: 'auto',
    storageManager: false,
    jsInHtml: false,
    panels: { defaults: [] },
    blockManager: {
      appendTo: '#blocks-panel',
      blocks: [
        { id: 'text', label: '文本', category: '基础', content: '<p data-gjs-type="text">双击编辑这段文字</p>' },
        { id: 'section', label: '区块', category: '基础', content: '<section style="padding:32px"><h2>新章节</h2><p>在这里补充内容。</p></section>' },
        { id: 'image', label: '图片', category: '基础', content: { type: 'image' }, select: true, activate: true },
      ],
    },
    styleManager: {
      appendTo: '#styles-panel',
      sectors: [
        { name: '排版', open: true, properties: ['font-family', 'font-size', 'font-weight', 'color', 'line-height', 'letter-spacing', 'text-align'] },
        { name: '空间', open: false, properties: ['margin', 'padding'] },
        { name: '尺寸', open: false, properties: ['width', 'height', 'max-width', 'min-height'] },
        { name: '外观', open: false, properties: ['background-color', 'border', 'border-radius', 'opacity'] },
        { name: '布局', open: false, properties: ['display', 'flex-direction', 'justify-content', 'align-items', 'gap'] },
      ],
    },
    selectorManager: { componentFirst: true },
    canvas: { frameStyle: 'html{background:#f4f4f5}body{min-height:100vh}' },
  })
  window.__GRAPESJS_WORKBENCH__ = { editor }
  editor.on('load', () => void injectSourceAssets())
  editor.on('update', scheduleSave)
  // GrapesJS 的 RTE 文本编辑走 storeData → sync:content（noCount:true）路径，
  // 不触发 editor 的 'update' 事件（changesCount 不增加）。但组件模型的
  // Backbone change 事件不受 noCount 影响，会转发为 component:update，
  // 因此补充监听该事件以覆盖文本内容编辑场景。
  editor.on('component:update', scheduleSave)
  editor.on('component:selected', updateAttributePanel)
}

function updateAttributePanel(component) {
  const tag = component?.get('tagName')
  const attributes = component?.getAttributes?.() || {}
  const image = tag === 'img'
  const link = tag === 'a'
  attributesPanel.hidden = !image && !link
  srcInput.parentElement.hidden = !image
  altInput.parentElement.hidden = !image
  hrefInput.parentElement.hidden = !link
  srcInput.value = attributes.src || ''
  altInput.value = attributes.alt || ''
  hrefInput.value = attributes.href || ''
}

function scheduleSave() {
  if (applyingDocument || workbenchMode !== 'edit' || !activeFile) return
  dirty = true
  setStatus('等待自动保存', 'dirty')
  clearTimeout(saveTimer)
  saveTimer = setTimeout(save, 500)
}

async function save() {
  if (!editor || !activeFile || !revision || !dirty) return
  clearTimeout(saveTimer)
  setStatus('正在写入磁盘', 'saving')
  try {
    const response = await fetch(api('/api/document'), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        baseRevision: revision,
        bodyHtml: getBodyHtml(),
        css: editor.getCss(),
        bodyScripts,
      }),
    })
    const result = await response.json()
    if (response.status === 409) {
      setStatus('磁盘有更新，已停止覆盖', 'conflict')
      dirty = false
      await applyDocument(result.document)
      return
    }
    if (!response.ok) throw new Error(result.message || result.error)
    revision = result.revision
    bodyScripts = result.bodyScripts || bodyScripts
    dirty = false
    setStatus('已与磁盘同步', 'saved')
  } catch (error) {
    setStatus(error.message || '保存失败', 'error')
  }
}

async function applyDocument(document) {
  activeFile = document.filePath
  assetBase = document.assetBase
  revision = document.revision
  bodyScripts = document.bodyScripts || []
  sourceCss = document.sourceCss || ''
  links = document.links || []
  headScripts = document.headScripts || []
  htmlAttributes = document.htmlAttributes || {}
  bodyAttributes = document.bodyAttributes || {}
  fileInput.value = activeFile
  fileName.textContent = document.fileName
  fileName.title = activeFile
  applyingDocument = true
  clearTimeout(saveTimer)
  dirty = false
  editor.setComponents(document.bodyHtml)
  editor.setStyle(document.overrideCss || '')
  await injectSourceAssets()
  requestAnimationFrame(() => editor.refresh())
  setTimeout(() => {
    clearTimeout(saveTimer)
    dirty = false
    applyingDocument = false
  }, 250)
}

async function loadFile(file = activeFile) {
  if (!file) return setStatus('请输入 HTML 文件路径', 'error')
  if (dirty) await save()
  setStatus('正在读取磁盘文件', 'saving')
  try {
    activeFile = file
    const response = await fetch(api('/api/document'))
    const document = await response.json()
    if (!response.ok) throw new Error(document.message || document.error)
    await applyDocument(document)
    dirty = false
    connectEvents()
    const url = new URL(location.href)
    url.searchParams.set('file', activeFile)
    history.replaceState({}, '', url)
    setFilePopover(false)
    setStatus('已与磁盘同步', 'saved')
  } catch (error) {
    setStatus(error.message || '加载失败', 'error')
  }
}

function connectEvents() {
  eventSource?.close()
  eventSource = new EventSource(api('/api/events'))
  eventSource.onmessage = async (event) => {
    const update = JSON.parse(event.data)
    if (!update.revision || update.revision === revision) return
    if (dirty) return setStatus('磁盘已更新，请先处理当前编辑', 'conflict')
    await loadFile(activeFile)
  }
  eventSource.onerror = () => setStatus('文件监听暂时断开', 'error')
}

function saveAttribute(name, input) {
  const selected = editor?.getSelected()
  if (!selected) return
  selected.addAttributes({ [name]: input.value })
  scheduleSave()
}

initEditor()
document.querySelector('#open-button').addEventListener('click', () => loadFile(fileInput.value.trim()))
fileInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') loadFile(fileInput.value.trim()) })
fileMenuButton.addEventListener('click', () => setFilePopover(filePopover.hidden))
panelButtons.forEach((button) => button.addEventListener('click', () => openPanel(button.dataset.panel)))
modeButtons.forEach((button) => button.addEventListener('click', () => setWorkbenchMode(button.dataset.mode)))
closePanelButton.addEventListener('click', closePanel)
pinPanelButton.addEventListener('click', () => setPanelPinned(!panelPinned))
document.querySelector('#undo-button').addEventListener('click', () => editor.UndoManager.undo())
document.querySelector('#redo-button').addEventListener('click', () => editor.UndoManager.redo())
saveButton.addEventListener('click', save)
document.querySelector('#replace-image-button').addEventListener('click', () => {
  const selected = editor.getSelected()
  if (!selected || selected.get('tagName') !== 'img') return setStatus('请先选中图片', 'error')
  const next = window.prompt('输入新的图片 URL 或相对路径', selected.getAttributes().src || '')
  if (next == null) return
  selected.addAttributes({ src: next })
  scheduleSave()
})
document.querySelectorAll('[data-width]').forEach((button) => button.addEventListener('click', () => {
  canvasWidth = Number(button.dataset.width)
  document.querySelectorAll('[data-width]').forEach((item) => item.classList.toggle('active', item === button))
  updateCanvasScale()
}))
fitButton.addEventListener('click', () => {
  fitCanvas = !fitCanvas
  fitButton.classList.toggle('active', fitCanvas)
  fitButton.setAttribute('aria-pressed', String(fitCanvas))
  updateCanvasScale()
})
canvasArea.addEventListener('click', (event) => {
  if (event.target === canvasArea || event.target === canvasStage) {
    if (!panelPinned) closePanel()
    setFilePopover(false)
  }
})
document.addEventListener('pointerdown', (event) => {
  if (!filePopover.hidden && !event.target.closest('.file-cluster')) setFilePopover(false)
})
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return
  setFilePopover(false)
  if (!panelPinned) closePanel()
})
new ResizeObserver(updateCanvasScale).observe(canvasArea)
srcInput.addEventListener('change', () => saveAttribute('src', srcInput))
altInput.addEventListener('change', () => saveAttribute('alt', altInput))
hrefInput.addEventListener('change', () => saveAttribute('href', hrefInput))

const initialFile = new URLSearchParams(location.search).get('file')
if (initialFile) loadFile(initialFile)
else setStatus('输入路径或使用 ?file= 打开 HTML', 'idle')
updateCanvasScale()

</script>
</body>
</html>
